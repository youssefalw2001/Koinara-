services:
  - type: web
    name: daira-queen-battles
    runtime: static
    repo: https://github.com/youssefalw2001/Koinara-
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_APP_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_STRIPE_LINK_ROSE_ENTRY
        sync: false
      - key: VITE_STRIPE_LINK_GOLDEN_ENTRY
        sync: false
      - key: VITE_STRIPE_LINK_DIAMOND_ENTRY
        sync: false
      - key: VITE_STRIPE_LINK_CROWN_ENTRY
        sync: false
